<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c111c">
  <meta name="description" content="Peer-to-peer voice calls and screen sharing.">
  <title>PeerRoom</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" type="module"></script>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong>PeerRoom</strong></div>
      <div class="header-right"><span class="status-dot" id="connectionDot"></span><span id="connectionLabel" role="status">Not connected</span></div>
    </header>

    <main class="layout">
      <section class="main-column">
        <div class="panel video-panel">
          <div class="panel-heading"><h2>Call</h2><span class="pill" id="sessionMode">No room</span></div>
          <div class="video-grid">
            <div class="video-card remote-card">
              <video id="remoteVideo" autoplay playsinline></video>
              <div class="video-empty" id="remoteEmpty"><div class="screen-icon" aria-hidden="true">▣</div><strong>No screen shared</strong></div>
              <div class="video-label"><span class="avatar-icon">↗</span> Peer</div>
              <button id="fullScreen" class="floating-action" type="button" title="Fullscreen" aria-label="Fullscreen remote screen" disabled>⛶</button>
            </div>
            <div class="video-card local-card">
              <video id="localVideo" autoplay playsinline muted></video>
              <div id="localEmpty" class="video-empty"><div class="screen-icon small-screen" aria-hidden="true">▤</div><strong>Preview</strong></div>
              <div class="video-label"><span class="avatar-icon self">●</span> You</div>
            </div>
          </div>
          <audio id="remoteAudio" autoplay playsinline></audio>
          <div class="call-controls">
            <button id="micButton" type="button" class="control-button" disabled><span class="control-icon">🎙</span><span id="micButtonLabel">Start mic</span></button>
            <button id="shareButton" type="button" class="control-button primary" disabled><span class="control-icon">▣</span><span id="shareButtonLabel">Share screen</span></button>
            <button id="audioButton" type="button" class="control-button" disabled><span class="control-icon">♫</span><span id="audioButtonLabel">Enable audio</span></button>
          </div>
          <div class="call-foot">
            <span><span class="tiny-dot" id="micDot"></span><span id="micStatus">Mic off</span></span>
            <span><span class="tiny-dot" id="screenDot"></span><span id="screenStatus">Not sharing</span></span>
            <span class="connection-note" id="iceStatus"></span>
          </div>
        </div>
        <div class="panel chat-panel">
          <div class="panel-heading"><h2>Chat</h2></div>
          <div id="chatLog" class="chat-log" role="log" aria-live="polite"><div class="empty-chat">No messages</div></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" autocomplete="off" maxlength="2000" placeholder="Message…" aria-label="Message" disabled>
            <button id="chatSend" class="send-button" type="submit" disabled>Send</button>
          </form>
        </div>
      </section>

      <aside class="panel setup-panel">
        <div class="panel-heading"><h2>Room</h2></div>
        <div id="createPanel">
          <button id="createButton" class="action-button" type="button">Create room <span>→</span></button>
        </div>
        <div id="roomPanel" class="hidden">
          <label class="field-label" for="roomLink">Invite link</label>
          <div class="link-control">
            <input type="text" id="roomLink" readonly aria-label="Invite link">
            <button type="button" id="copyLink" class="action-button">Copy</button>
          </div>
          <div class="room-status" id="roomStatus">Waiting for peer…</div>
          <button id="leaveButton" class="secondary-button" type="button">Leave room</button>
        </div>
        <details class="settings-box">
          <summary>Audio settings</summary>
          <div class="settings-content">
            <label class="setting">
              <span><strong>Music input</strong><small>Disable voice processing</small></span>
              <input type="checkbox" id="musicMode" checked>
            </label>
            <label class="device-setting" for="micDevice">
              <strong>Input device</strong>
              <select id="micDevice"><option value="">System default</option></select>
            </label>
          </div>
        </details>
        <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
      </aside>
    </main>
  </div>
</body>
</html>
