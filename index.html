<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111214">
  <meta name="description" content="A simple place to talk, share your screen, and connect peer-to-peer.">
  <title>PeerRoom — Voice room</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" type="module"></script>
</head>
<body>
  <div class="app-shell">
    <div class="app-rail" aria-hidden="true">
      <div class="rail-logo" title="PeerRoom"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
      <div class="rail-separator" aria-hidden="true"></div>
      <span class="rail-item active" title="Voice room" aria-label="Voice room"><img src="./icons/radio.svg" alt=""></span>
      <div class="rail-bottom"><span class="rail-item muted" title="Peer-to-peer" aria-label="Peer-to-peer"><img src="./icons/shield-check.svg" alt=""></span></div>
    </div>

    <aside class="room-sidebar">
      <div class="sidebar-top"><span class="sidebar-name">PeerRoom</span><span class="sidebar-badge">BETA</span></div>
      <div class="sidebar-content">
        <div class="sidebar-caption">YOUR SPACE</div>
        <div class="room-channel" aria-current="page">
          <span class="channel-icon"><img src="./icons/headphones.svg" alt=""></span>
          <div class="channel-text"><strong>Voice lounge</strong><small>Private room</small></div>
          <span class="channel-dot"></span>
        </div>

        <div class="sidebar-label"><img src="./icons/users-round.svg" alt=""><span>PEOPLE</span></div>
        <div class="people-list">
          <div class="person-row">
            <span class="person-avatar self"><img src="./icons/user-round.svg" alt=""></span>
            <span class="person-name">You</span>
            <span class="person-hint" id="micSidebarStatus">Idle</span>
          </div>
          <div class="person-row peer-row" id="peerRow">
            <span class="person-avatar"><img src="./icons/user-round.svg" alt=""></span>
            <span class="person-name">Peer</span>
            <span class="person-hint" id="peerSidebarStatus">Waiting</span>
          </div>
        </div>
      </div>
      <div class="sidebar-bottom">
        <details class="settings-box">
          <summary><span class="summary-label"><img src="./icons/sliders-horizontal.svg" alt=""> Audio settings</span><img class="chevron" src="./icons/chevron-down.svg" alt=""></summary>
          <div class="settings-content">
            <label class="setting">
              <span><strong>Music input</strong><small>Raw audio</small></span>
              <input type="checkbox" id="musicMode" checked>
            </label>
            <label class="device-setting" for="micDevice">
              <strong>Input device</strong>
              <select id="micDevice"><option value="">System default</option></select>
            </label>
          </div>
        </details>
        <div class="user-mini"><span class="mini-avatar"><img src="./icons/user-round.svg" alt=""></span><div><strong>You</strong><small id="micStatus">Mic off</small></div><span class="tiny-dot" id="micDot"></span></div>
      </div>
    </aside>

    <main class="call-area">
      <header class="main-topbar">
        <div class="topbar-room"><img src="./icons/headphones.svg" alt=""><span>Voice lounge</span><span class="topbar-divider" aria-hidden="true"></span><small>Peer-to-peer</small></div>
        <div class="header-right"><span class="status-dot" id="connectionDot"></span><span id="connectionLabel" role="status">Not connected</span></div>
      </header>

      <section class="call-content">
        <div class="session-heading"><div><span class="eyebrow">VOICE ROOM</span><h1>Voice lounge</h1></div><span class="pill" id="sessionMode">No room</span></div>

        <div class="video-grid">
          <div class="video-card remote-card">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-empty" id="remoteEmpty"><div class="participant-avatar"><img src="./icons/user-round.svg" alt=""></div><strong>Peer</strong><span>Waiting for screen share</span></div>
            <div class="video-label"><span class="avatar-dot"></span>Peer</div>
            <button id="fullScreen" class="floating-action" type="button" title="Fullscreen" aria-label="Fullscreen remote screen" disabled><img src="./icons/maximize.svg" alt=""></button>
          </div>
          <div class="video-card local-card">
            <video id="localVideo" autoplay playsinline muted></video>
            <div id="localEmpty" class="video-empty"><div class="participant-avatar self"><img src="./icons/user-round.svg" alt=""></div><strong>You</strong><span>Your screen</span></div>
            <div class="video-label"><span class="avatar-dot self"></span>You</div>
          </div>
        </div>
        <audio id="remoteAudio" autoplay playsinline></audio>

        <div class="bottom-controls">
          <div class="call-controls">
            <button id="micButton" type="button" class="control-button" disabled title="Microphone"><span class="control-icon"><img id="micIcon" src="./icons/mic.svg" alt=""></span><span id="micButtonLabel">Start mic</span></button>
            <button id="shareButton" type="button" class="control-button" disabled title="Screen share"><span class="control-icon"><img id="shareIcon" src="./icons/monitor-up.svg" alt=""></span><span id="shareButtonLabel">Share screen</span></button>
            <button id="audioButton" type="button" class="control-button" disabled title="Remote audio"><span class="control-icon"><img id="audioIcon" src="./icons/volume-2.svg" alt=""></span><span id="audioButtonLabel">Enable audio</span></button>
          </div>
          <div class="call-foot"><span><span class="tiny-dot" id="screenDot"></span><span id="screenStatus">Not sharing</span></span><span class="connection-note" id="iceStatus"></span></div>
        </div>
      </section>
    </main>

    <aside class="chat-sidebar">
      <div class="chat-topbar"><span><img src="./icons/message-circle.svg" alt="">Chat</span><span class="chat-private" title="Peer-to-peer"><img src="./icons/lock-keyhole.svg" alt=""></span></div>
      <div id="chatLog" class="chat-log" role="log" aria-live="polite"><div class="empty-chat"><img src="./icons/messages-square.svg" alt=""><strong>No messages yet</strong></div></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" autocomplete="off" maxlength="2000" placeholder="Message…" aria-label="Message" disabled>
        <button id="chatSend" class="send-button" type="submit" aria-label="Send message" title="Send" disabled><img src="./icons/send.svg" alt=""></button>
      </form>
    </aside>

    <section class="room-dock" aria-label="Room controls">
      <div class="dock-title"><span class="dock-icon"><img src="./icons/link-2.svg" alt=""></span><strong>Your room</strong></div>
      <div id="createPanel"><button id="createButton" class="action-button" type="button"><img src="./icons/plus.svg" alt=""><span>Create room</span></button></div>
      <div id="roomPanel" class="hidden">
        <label for="roomLink" class="sr-only">Invite link</label>
        <div class="link-control"><input type="text" id="roomLink" readonly aria-label="Invite link"><button type="button" id="copyLink" class="icon-button" title="Copy link" aria-label="Copy invite link"><img src="./icons/copy.svg" alt=""><span>Copy</span></button></div>
        <div class="room-status" id="roomStatus">Waiting for peer…</div>
        <button id="leaveButton" class="secondary-button" type="button"><img src="./icons/log-out.svg" alt=""><span>Leave room</span></button>
      </div>
      <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
    </section>
  </div>
</body>
</html>
